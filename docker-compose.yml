# Infra for local development: Postgres (+ optional MinIO for S3-compatible storage).
#   docker compose up -d            # Postgres only
#   docker compose --profile s3 up -d   # + MinIO (console at http://localhost:9001)
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hangar
      POSTGRES_PASSWORD: hangar
      POSTGRES_DB: hangar
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hangar"]
      interval: 5s
      retries: 10

  minio:
    profiles: ["s3"]
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: hangar
      MINIO_ROOT_PASSWORD: hangar-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]

volumes:
  pgdata:
  miniodata:
